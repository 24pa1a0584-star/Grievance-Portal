<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gradient-to-b from-blue-100 to-blue-50 min-h-screen flex flex-col items-center justify-center px-4">

  <!-- Back to Home -->
  <a href="../index.html" class="self-start text-blue-600 text-sm flex items-center space-x-1 mb-6">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
    <span>Back to Home</span>
  </a>

  <!-- User Icon -->
  <div class="bg-blue-600 w-14 h-14 rounded-full flex items-center justify-center mb-4 shadow-md">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A7.5 7.5 0 0112 15a7.5 7.5 0 016.879 2.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
  </div>

  <!-- Heading -->
  <h1 class="text-2xl font-semibold text-gray-900 mb-1">Login</h1>
  <p class="text-gray-600 mb-8">Sign in to access your dashboard</p>

  <!-- Login Form -->
  <form class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md space-y-5" action="#" method="POST" autocomplete="off">
    <!-- Username -->
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username or Registration Number</label>
      <div class="relative">
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          class="w-full border border-gray-300 rounded-md pl-10 pr-3 py-2 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          required
        />
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A7.5 7.5 0 0112 15a7.5 7.5 0 016.879 2.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <div class="relative">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          class="w-full border border-gray-300 rounded-md pl-10 pr-3 py-2 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          required
        />
        <!-- Show Password Checkbox -->
        <div class="show-password-container">
          <input type="checkbox" id="showPassword">
          <label for="showPassword">Show Password</label>
        </div>
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c.667 0 1 .333 1 1v2a1 1 0 01-2 0v-2c0-.667.333-1 1-1z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 11V7a5 5 0 00-10 0v4" />
            <rect width="12" height="7" x="6" y="11" rx="2" ry="2" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Sign In Button -->
    <button
      type="submit"
      class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold py-2 rounded-lg shadow-md hover:from-blue-700 hover:to-blue-800 transition"
    >
      Sign In
    </button>
  </form>

  <!-- Forgot Password Button -->
<a href="./forgot-password.html"
  class="block text-center text-blue-600 mt-3 text-sm hover:underline">
  Forgot Password?
</a>

  <!-- Create New Account -->
  <div class="bg-white rounded-xl shadow-lg p-5 max-w-md w-full mt-6 text-center">
    <p class="text-gray-700 mb-3">Don't have an account?</p>
    <a
      href="./register.html"
      class="inline-flex items-center justify-center space-x-2 border border-blue-600 text-blue-600 px-4 py-2 rounded-lg font-medium hover:bg-blue-50 transition"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Create New Account</span>
    </a>
  </div>
  <script src="../scripts/login-show-password.js"></script>
</body>
</html>
